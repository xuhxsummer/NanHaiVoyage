buildscript {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
    dependencies {
        // BootJar and AGP share the buildscript classloader; use the modern ZIP API.
        classpath 'org.apache.commons:commons-compress:1.27.1'
        if (findProject(':android') != null) {
            classpath 'com.android.tools.build:gradle:8.1.4'
        }
    }
}

allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'
}

configure(subprojects.findAll { it.name != 'android' }) {
    apply plugin: 'java-library'
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    compileJava {
        options.incremental = true
        options.encoding = 'UTF-8'
    }
}

subprojects {
    version = '0.23.0'
    ext.appName = 'NanHaiVoyage'
    ext.gdxVersion = gdxVersion
    repositories {
        mavenCentral()
        google()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://jitpack.io' }
    }
}

eclipse.project.name = 'NanHaiVoyage-parent'
