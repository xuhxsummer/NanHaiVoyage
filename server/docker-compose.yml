services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: nanhai
      POSTGRES_USER: nanhai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cloud-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanhai"]
      interval: 5s
      retries: 10
volumes:
  cloud-data:
